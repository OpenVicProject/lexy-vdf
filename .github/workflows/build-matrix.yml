name: 🔢 Build Matrix

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - identifier: windows-debug
            os: windows-latest
            name: 🏁 Windows Debug
            target: template_debug
            platform: windows
            arch: x86_64
            test-bin-suffix: .md.exe

          - identifier: windows-debug-mingw
            os: windows-latest
            name: 🏁 Windows Debug (MinGW)
            target: template_debug
            platform: windows
            arch: x86_64
            mingw: true
            test-bin-suffix: .md.exe

          - identifier: windows-release
            os: windows-latest
            name: 🏁 Windows Release
            target: template_release
            platform: windows
            arch: x86_64
            test-bin-suffix: .md.exe

          - identifier: windows-release-mingw
            os: windows-latest
            name: 🏁 Windows Release (MinGW)
            target: template_release
            platform: windows
            arch: x86_64
            mingw: true
            test-bin-suffix: .md.exe

          - identifier: macos-debug
            os: macos-latest
            name: 🍎 macOS (universal) Debug
            target: template_debug
            platform: macos
            arch: universal

          - identifier: macos-release
            os: macos-latest
            name: 🍎 macOS (universal) Release
            target: template_release
            platform: macos
            arch: universal

          - identifier: linux-debug
            os: ubuntu-22.04
            name: 🐧 Linux Debug
            target: template_debug
            platform: linux
            arch: x86_64

          - identifier: linux-release
            os: ubuntu-22.04
            name: 🐧 Linux Release
            target: template_release
            platform: linux
            arch: x86_64

    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup MinGW for Windows/MinGW build
        if: matrix.platform == 'windows' && (matrix.mingw || false)
        uses: egor-tensin/setup-mingw@ef0952fadae6794e225c0c1654887408bcadbf64

      - name: Build
        uses: ./.github/actions/lvdf-build
        with:
          identifier: ${{ matrix.identifier }}
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
